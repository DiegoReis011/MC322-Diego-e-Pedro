// So configuracao de build: nenhuma regra da fabrica mora aqui.
plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

// O programa em si nao usa bibliotecas externas. So os testes usam o JUnit 5.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.unicamp.ic.mc322.Main'
}

// Os fontes tem acento: sem isso, num Windows o padrao nao e UTF-8.
// O release 17 gera bytecode que roda em qualquer JDK 17 ou mais novo.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

javadoc {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.author = true
}

// Sem isso o ./gradlew run nao le o teclado e o menu fecha na hora.
run {
    standardInput = System.in
}

// ./gradlew test (e tambem ./gradlew build) roda a suite JUnit 5 sem abrir o
// menu: nenhum teste le o teclado. O relatorio HTML sai em
// build/reports/tests/test/index.html.
test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}
